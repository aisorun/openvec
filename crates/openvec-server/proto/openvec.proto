syntax = "proto3";

package openvec;

service OpenVecService {
    rpc CreateCollection(CreateCollectionRequest) returns (CollectionMetaResponse);
    rpc DropCollection(DropCollectionRequest) returns (DropCollectionResponse);
    rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
    rpc InsertDocument(InsertDocumentRequest) returns (InsertDocumentResponse);
    rpc BatchInsert(BatchInsertRequest) returns (BatchInsertResponse);
    rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
    rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
    rpc Search(SearchRequest) returns (SearchResponse);
}

message CreateCollectionRequest {
    string name = 1;
    uint32 dimension = 2;
    string metric = 3; // "l2", "cosine", "dot"
    repeated string fulltext_fields = 4;
}

message CollectionMetaResponse {
    string name = 1;
    uint32 dimension = 2;
    string metric = 3;
    repeated string fulltext_fields = 4;
}

message DropCollectionRequest {
    string name = 1;
}

message DropCollectionResponse {
    bool success = 1;
}

message ListCollectionsRequest {}

message ListCollectionsResponse {
    repeated CollectionMetaResponse collections = 1;
}

message ScalarValue {
    oneof value {
        int64 int_value = 1;
        double float_value = 2;
        string text_value = 3;
        bool bool_value = 4;
        bool null_value = 5;
    }
}

message Document {
    string id = 1;
    repeated float vector = 2; // default vector
    map<string, ScalarValue> payload = 3;
}

message InsertDocumentRequest {
    string collection = 1;
    Document document = 2;
}

message InsertDocumentResponse {
    string id = 1;
}

message BatchInsertRequest {
    string collection = 1;
    repeated Document documents = 2;
}

message BatchInsertResponse {
    repeated string ids = 1;
}

message GetDocumentRequest {
    string collection = 1;
    string id = 2;
}

message GetDocumentResponse {
    bool found = 1;
    Document document = 2;
}

message DeleteDocumentRequest {
    string collection = 1;
    string id = 2;
}

message DeleteDocumentResponse {
    bool success = 1;
}

message SearchRequest {
    string collection = 1;
    repeated float vector = 2;
    uint32 limit = 3;
    string vector_field = 4;
    optional uint32 ef = 5;
    optional string hybrid_query = 6;
    optional float vector_weight = 7;
    optional float text_weight = 8;
}

message SearchResult {
    string id = 1;
    float score = 2;
    map<string, ScalarValue> payload = 3;
}

message SearchResponse {
    repeated SearchResult results = 1;
}
